<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .animating {
            height: 100px;
            width: 100px;
            color: tomato;
            animation-duration: 12s;
            animation-name: rohit;
            animation-iteration-count: 3;
            position: relative;
        }
        @keyframes rohit {
            0%{background-color: aqua; left: 0px; top: 0px;}
            25%{background-color: red; left: 200px; top: 0px;}
            50%{background-color: blueviolet; left: 200px; top: 0px;}
            75%{background-color: aqua; left: 0px; top: 200px;}
            100%{background-color: aqua; left: 0px; top: 0px;}
        }
    </style>

</head>
<body>
    <div class="animating">

    </div>
    
</body>
</html>
