<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment</title>

<style>
body{
    font-family:Arial;
    background:#f5f5f5;
    margin:0;
}

.container{
    width:400px;
    background:white;
    margin:50px auto;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
}

button{
    width:100%;
    padding:12px;
    background:black;
    color:white;
    border:none;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
    <h2>Payment Details</h2>

    <input type="text" placeholder="Card Holder Name">
    <input type="text" placeholder="Card Number">
    <input type="text" placeholder="Expiry Date">
    <input type="password" placeholder="CVV">

    <button>Pay Now</button>
</div>

</body>
</html>
