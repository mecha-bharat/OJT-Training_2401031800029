<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

.login-box{

    width:350px;
    background:white;

    padding:40px;

    border-radius:10px;

    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.login-box h2{

    text-align:center;
    margin-bottom:25px;
}

.login-box input{

    width:100%;
    padding:12px;

    margin-bottom:15px;

    border:1px solid #ccc;

    border-radius:5px;

    font-size:16px;
}

.login-box button{

    width:100%;
    padding:12px;

    border:none;

    background:blue;
    color:white;

    font-size:16px;

    border-radius:5px;

    cursor:pointer;
}

.login-box button:hover{
    background:darkblue;
}

.login-box p{

    text-align:center;
    margin-top:15px;
}

.login-box a{
    color:blue;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="login-box">

    <h2>Login</h2>

    <form>

        <input type="email"
               placeholder="Enter Email"
               required>

        <input type="password"
               placeholder="Enter Password"
               required>

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="register.html">
            Register
        </a>
    </p>

</div>

</body>
</html>
