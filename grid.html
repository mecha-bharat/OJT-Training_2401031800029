<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <style>
        .grid-container{
            display: grid ;
            padding: 10px;
            grid-template-columns: auto auto;
            
        }
        .grid-item{
            display: grid;
            color: black;
            
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-item">class1</div>
        <div class="grid-item">class2</div>
        <div class="grid-item">class3</div>
        <div class="grid-item">class4</div>
        <div class="grid-item">class5</div>
        <div class="grid-item">class6</div>
    </div>
    
</body>
</html>
