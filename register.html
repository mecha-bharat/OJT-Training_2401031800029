<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<style>
body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

.register-box{

    width:350px;
    background:white;

    padding:50px;

    border-radius:10px;

    box-shadow:0 0 10px rgba(0, 0, 0, 0.2);
}

.register-box h2{

    text-align:center;
    margin-bottom:20px;
}

.register-box input{

    width:100%;
    padding:12px;

    margin-bottom:15px;

    border:1px solid #ccc;

    border-radius:5px;

    font-size:16px;
}

.register-box button{

    width:100%;
    padding:12px;

    border:none;

    background:green;
    color:white;

    font-size:16px;

    border-radius:5px;

    cursor:pointer;
}

.register-box button:hover{
    background:rgb(0, 0, 0);
}

.register-box p{

    text-align:center;
    margin-top:15px;
}

.register-box a{
    color:blue;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="register-box">

    <h2>Register</h2>

    <form>

        <input type="text"
               placeholder="Full Name"
               required>

        <input type="email"
               placeholder="Enter Email"
               required>

        <input type="password"
               placeholder="Create Password"
               required>

        <input type="password"
               placeholder="Confirm Password"
               required>

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already have an account?
        <a href="reg.html">
            Login
        </a>
    </p>

</div>

</body>
</html>
